openapi: 3.1.0
info:
  title: Payment Cycle API
  version: 1.0.0
  description: API contract for operator-triggered monthly payment cycle generation and review.
servers:
  - url: /api/v1
paths:
  /payment-cycles:
    post:
      summary: Generate a payment cycle for a monthly competence
      operationId: generatePaymentCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePaymentCycleRequest'
      responses:
        '201':
          description: Payment cycle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCycleSummary'
        '409':
          description: A cycle already exists for the selected competence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Generation request invalid for business rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server-side generation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List payment cycles, optionally filtered by competence
      operationId: listPaymentCycles
      parameters:
        - in: query
          name: competence
          schema:
            type: string
            pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Payment cycle list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentCycleSummary'
  /payment-cycles/{cycleId}:
    get:
      summary: Get details for a generated payment cycle
      operationId: getPaymentCycle
      parameters:
        - in: path
          name: cycleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment cycle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCycleDetail'
        '404':
          description: Cycle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server-side read error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payment-cycles/{cycleId}/entries:
    get:
      summary: List cycle entries by inclusion outcome
      operationId: listPaymentCycleEntries
      parameters:
        - in: path
          name: cycleId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: inclusionStatus
          schema:
            type: string
            enum: [INCLUDED, EXCLUDED]
      responses:
        '200':
          description: Cycle entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentCycleEntry'
        '404':
          description: Cycle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    GeneratePaymentCycleRequest:
      type: object
      required: [competence, initiatedBy]
      properties:
        competence:
          type: string
          pattern: '^[0-9]{6}$'
          description: Monthly competence in YYYYMM format
        initiatedBy:
          type: string
        dryRun:
          type: boolean
          default: false
    PaymentCycleSummary:
      type: object
      required: [id, competence, status, includedCount, excludedCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        competence:
          type: string
        status:
          type: string
          enum: [GENERATING, GENERATED, FAILED, CANCELLED]
        includedCount:
          type: integer
        excludedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
          nullable: true
    PaymentCycleDetail:
      allOf:
        - $ref: '#/components/schemas/PaymentCycleSummary'
        - type: object
          properties:
            generationSummary:
              type: string
            initiatedBy:
              type: string
    PaymentCycleEntry:
      type: object
      required: [beneficiaryId, inclusionStatus]
      properties:
        beneficiaryId:
          type: string
          format: uuid
        beneficiaryCpf:
          type: string
        programCode:
          type: string
        inclusionStatus:
          type: string
          enum: [INCLUDED, EXCLUDED]
        exclusionReasonCode:
          type: string
          nullable: true
        exclusionReasonText:
          type: string
          nullable: true
        grossAmount:
          type: number
          format: double
          nullable: true
        discountAmount:
          type: number
          format: double
          nullable: true
        netAmount:
          type: number
          format: double
          nullable: true
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string